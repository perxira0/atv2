<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Pokémon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="imagem-box">
      <img id="imagem" src="" alt="Imagem do Pokémon">
    </div>

    <h1 id="nome">Carregando...</h1>
    <span class="badge" id="id">ID: -</span>

    <div class="infos">
      <div class="info">
        <span class="rotulo">Altura</span>
        <strong id="altura">-</strong>
        <span class="unidade">decímetros</span>
      </div>
      <div class="info">
        <span class="rotulo">Peso</span>
        <strong id="peso">-</strong>
        <span class="unidade">hectogramas</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
